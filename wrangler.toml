name                = "sgs-ai-widget"
main                = "src/index.js"
compatibility_date  = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
workers_dev         = true

[observability.logs]
enabled         = true
invocation_logs = true

[vars]
ENVIRONMENT       = "production"
ALLOWED_ORIGIN    = "https://orders.stellarglobalsupplies.com"

[[kv_namespaces]]
binding = "AI_PRICING"
id = "9d0a2c5de0164a08a1551ebe87e65299"

# Kept as a fallback/reference only — NOT used for the actual tool-call fetch.
# Cloudflare blocks a Worker from fetch()-ing another Worker's *.workers.dev
# hostname directly (error 1042), so the real call goes through the service
# binding below (ORDERS_API) instead of this URL.
ORDERS_API_BASE   = "https://sgs-orders-worker.workwithprasadbhavsar.workers.dev"

# Service binding to the orders-backend worker — lets this worker call it
# directly over Cloudflare's internal network, bypassing the public-network
# restriction (error 1042) that blocks Worker-to-Worker fetch() over
# *.workers.dev hostnames. Update `service` if the backend's [name] in its
# own wrangler.toml ever changes.
[[services]]
binding = "ORDERS_API"
service = "sgs-orders-worker"

# D1 — separate DB from stellarai's, scoped to this widget only
[[d1_databases]]
binding       = "DB"
database_name = "sgs-ai-widget-db"
database_id   = "1ffbef1e-b8fa-4540-9668-11b57e21fadb"

# Workers AI — single model handles chat, extraction, and tool-calling
[ai]
binding = "AI"

# Browser Rendering — used only as a fallback for scanned/image-only PDFs
# (i.e. when toMarkdown() finds no text layer). Free tier: 10 min/day,
# 3 concurrent browsers — comfortably enough for a few orders/day.
[browser]
binding = "MYBROWSER"

# Cron for 6-month history cleanup (mirrors stellarai)
#[triggers]
#crons = ["0 3 * * *"]

# Revenium AI metering — Cloudflare Secrets Store binding (account-level,
# shared across Workers/products — not a per-Worker `wrangler secret`).
# store_id: your Secrets Store ID (Dashboard → Secrets Store, or
#           `wrangler secrets-store store list --remote`)
# secret_name: the name you gave the secret when you created it
# Accessed in code via: await env.REVENIUM_API_KEY.get()  (see src/revenium.js)
[[secrets_store_secrets]]
binding     = "REVENIUM_API_KEY"
store_id    = "2556bcd9458349f6b4ff2a3fc93bdba1"
secret_name = "REVENIUM_API_KEY"

# ── Deployment ───────────────────────────────────────────────────────────────
# 1. wrangler d1 create sgs-order-ai-widget-db   → paste database_id above
# 2. wrangler d1 execute sgs-order-ai-widget-db --file=schema.sql
# 3. One-time, if you don't already have a store/secret for this key:
#      wrangler secrets-store store create default --remote        (if no store yet)
#      wrangler secrets-store secret create <STORE_ID> \
#        --name REVENIUM_API_KEY --scopes workers --remote
#    Then paste the real store_id above into [[secrets_store_secrets]].
# 4. wrangler deploy
# 5. In orders-frontend .env: REACT_APP_AI_WIDGET_URL = https://sgs-ai-widget.workwithprasadbhavsar.workers.dev
